spring.application.name=buildledger
server.port=${SERVER_PORT:8080}

# Spring Data MongoDB Configuration (supports both spring.data.mongodb and spring.mongodb)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:buildledger}
spring.data.mongodb.auto-index-creation=true

spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:buildledger}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

jwt.secret=${JWT_SECRET}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}